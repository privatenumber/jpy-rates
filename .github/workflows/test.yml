name: Test

on:
  push:
  pull_request:

jobs:
  test:
    name: Test (Node ${{ matrix.node-version || '.nvmrc' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Empty value uses .nvmrc; 22.22.2 is the minimum in package.json engines
        node-version: ["", 22.22.2]
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4

      - name: Setup Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6
        with:
          node-version: ${{ matrix.node-version }}
          node-version-file: ${{ !matrix.node-version && '.nvmrc' || '' }}

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm type-check

      - name: Test
        run: pnpm test
